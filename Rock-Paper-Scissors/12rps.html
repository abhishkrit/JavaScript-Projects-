<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12rps.css">
    <script src="12rps.js"></script>
    
  </head>
  <body>
    <p class="style-title">Rock Paper Scissors</p>
    <div class="pick-div"> 
    <button onclick="game('Rock');"><img src="Images/Rock-emoji.png"></button>
    <button onclick="game('Paper');"><img src="Images/Paper-emoji.png"></button>
    <button onclick="game('Scissors');"><img src="Images/Scissors-emoji.png"></button>
    </div>

    <p class="js-result"> </p> 
    <p class="js-moves">

    </p>
    <p class="js-score"></p>

    <button onclick="
      score_1.wins=0;
      score_1.looses=0;
      score_1.ties=0;
      localStorage.removeItem('score_1');
      updateScore();
      document.querySelector('.js-result').innerHTML='';
      document.querySelector('.js-moves').innerHTML='';
    "
    class="reset-button"
    >Reset score</button>
    <button class="autoPlayButton" onclick="autoPlay();">
      Auto Play</button>

  </body>
</html>
